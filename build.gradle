plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'

	// For cobblemon
	id "org.jetbrains.kotlin.jvm" version "2.1.10"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				url "https://cursemaven.com"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}

	// cobblemon
	maven {
		url = "https://maven.impactdev.net/repository/development/"
	}
	maven {
		url = "https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-stdlib/2.1.10"
	}

	// Create
	maven { url = "https://mvn.devos.one/snapshots" }
	maven { url = "https://mvn.devos.one/releases" }
	maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
	maven { url = "https://maven.tterrag.com/" }
	maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
	maven {
		url = "https://jitpack.io/"
		content { includeGroupAndSubgroups("com.github") }
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}


dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Biomes O' Plenty
	modRuntimeOnly "curse.maven:biomes-o-plenty-220318:6364066"
	modRuntimeOnly "curse.maven:terrablender-fabric-565956:6290449"
	modRuntimeOnly "curse.maven:glitchcore-955399:5787838"
	runtimeOnly "com.electronwill.night-config:toml:3.6.5"
	runtimeOnly "com.electronwill.night-config:core:3.6.5"
	runtimeOnly "net.jodah:typetools:0.6.3"

	// Cobblemon
	modRuntimeOnly "com.cobblemon:fabric:1.5.2+1.20.1"
	modRuntimeOnly "com.cobblemon:mod:1.5.2+1.20.1"
	modRuntimeOnly "net.fabricmc:fabric-language-kotlin:1.13.2+kotlin.2.1.20"

	// Create
	modRuntimeOnly "com.simibubi.create:create-fabric-$minecraft_version:0.5.1-j-build.1631+mc1.20.1"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}